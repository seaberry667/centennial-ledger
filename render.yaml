services:
  - type: web
    name: centennial-ledger
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: centennial-ledger-db
          property: connectionString
      - key: INGEST_SECRET
        generateValue: true
      - key: ADSENSE_PUBLISHER_ID
        sync: false
      - key: SITE_URL
        value: https://centennialledger.com
      - key: NODE_ENV
        value: production

databases:
  - name: centennial-ledger-db
    plan: basic-256mb
